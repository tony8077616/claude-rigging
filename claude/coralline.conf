# coralline config
. "$HOME/.claude/coralline/themes/claude-coral.conf"

VL_STYLE="pill"
VL_LAYOUT="fixed"
VL_MAX_LINES=3
VL_WRAP_MARGIN=4
VL_SEGMENTS="dir project git stash clock duration"
